<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的读书笔记 · 微信读书</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #FAF9F6;
  --card: #FFFFFF;
  --primary: #2B3A55;
  --accent: #C77D3F;
  --accent-light: #E8C9A0;
  --accent-bg: #FBF3E8;
  --text: #2C2C2C;
  --text-secondary: #6B6B6B;
  --text-light: #999999;
  --border: #E8E5DF;
  --green: #4A7C59;
  --green-light: #E3EDE5;
  --blue: #3B5B7E;
  --blue-light: #E0E8F0;
  --purple: #6B4E7D;
  --purple-light: #EDE5F0;
  --red: #B5443A;
  --red-light: #F5E0DC;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.8;
}
.container { max-width: 960px; margin: 0 auto; padding: 48px 32px 80px; }

/* HERO */
.hero {
  text-align: center;
  margin-bottom: 48px;
  padding: 56px 40px;
  background: linear-gradient(135deg, #2B3A55 0%, #1E2D45 100%);
  border-radius: 20px;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(199,125,63,0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
.hero .subtitle { font-size: 14px; color: rgba(255,255,255,0.7); }
.hero .stats { display: flex; gap: 32px; justify-content: center; margin-top: 24px; }
.hero .stat { text-align: center; }
.hero .stat-num { font-size: 28px; font-weight: 700; color: var(--accent-light); }
.hero .stat-label { font-size: 12px; color: rgba(255,255,255,0.6); }

/* SEARCH */
.search-bar {
  margin-bottom: 32px;
  position: relative;
}
.search-bar input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 15px;
  background: var(--card);
  box-shadow: var(--shadow);
  outline: none;
  transition: border-color 0.2s;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar .icon {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
  font-size: 18px;
}

/* BOOK GRID */
.book-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}
.book-card {
  background: var(--card);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  border-top: 3px solid var(--accent);
  position: relative;
}
.book-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.book-card:nth-child(6n+1) { border-top-color: var(--red); }
.book-card:nth-child(6n+2) { border-top-color: var(--accent); }
.book-card:nth-child(6n+3) { border-top-color: var(--blue); }
.book-card:nth-child(6n+4) { border-top-color: var(--green); }
.book-card:nth-child(6n+5) { border-top-color: var(--purple); }
.book-card:nth-child(6n) { border-top-color: var(--accent); }

.book-card .badge {
  position: absolute;
  top: 12px; right: 12px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--accent-bg);
  color: var(--accent);
}
.book-card h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
  padding-right: 40px;
  line-height: 1.4;
}
.book-card .author {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 12px;
}
.book-card .meta {
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: var(--text-secondary);
}
.book-card .meta span {
  display: flex;
  align-items: center;
  gap: 3px;
}
.book-card .progress-bar {
  margin-top: 10px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.book-card .progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
}

/* READER VIEW */
.reader {
  display: none;
  background: var(--card);
  border-radius: 16px;
  padding: 48px;
  box-shadow: var(--shadow);
  min-height: 600px;
}
.reader.active { display: block; }
.reader-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--accent);
  cursor: pointer;
  margin-bottom: 24px;
}
.reader-back:hover { text-decoration: underline; }
.reader-content { font-size: 15px; line-height: 1.8; color: var(--text); }
.reader-content h1 { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
.reader-content h2 { font-size: 20px; font-weight: 700; color: var(--primary); margin: 32px 0 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.reader-content h3 { font-size: 17px; font-weight: 600; color: var(--primary); margin: 24px 0 12px; }
.reader-content blockquote {
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  margin: 12px 0;
  background: var(--accent-bg);
  border-radius: 0 8px 8px 0;
  color: var(--text);
}
.reader-content blockquote p { margin: 4px 0; }
.reader-content ul, .reader-content ol { padding-left: 24px; margin: 12px 0; }
.reader-content li { margin: 6px 0; }
.reader-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.reader-content em { color: var(--text-light); font-size: 13px; }
.reader-content strong { color: var(--primary); }
.reader-content code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.reader-content table { width: 100%; border-collapse: collapse; margin: 16px 0; }
.reader-content th, .reader-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.reader-content th { background: var(--bg); font-weight: 600; }

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-light);
}

@media (max-width: 768px) {
  .container { padding: 24px 16px 48px; }
  .hero { padding: 40px 24px; }
  .hero h1 { font-size: 22px; }
  .book-grid { grid-template-columns: repeat(2, 1fr); }
  .reader { padding: 24px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- HERO -->
  <div class="hero" id="heroSection">
    <h1>📚 我的读书笔记</h1>
    <div class="subtitle">微信读书 · 划线与想法整理</div>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="statBooks">0</div><div class="stat-label">本书</div></div>
      <div class="stat"><div class="stat-num" id="statNotes">0</div><div class="stat-label">条笔记</div></div>
      <div class="stat"><div class="stat-num" id="statHighlights">0</div><div class="stat-label">条划线</div></div>
      <div class="stat"><div class="stat-num" id="statReviews">0</div><div class="stat-label">条想法</div></div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar" id="searchBar">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索书名或作者..." oninput="filterBooks()">
  </div>

  <!-- BOOK GRID -->
  <div class="book-grid" id="bookGrid"></div>

  <!-- READER -->
  <div class="reader" id="reader">
    <div class="reader-back" onclick="closeReader()">← 返回书架</div>
    <div class="reader-content" id="readerContent"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    整理日期：2026-09-04 ｜ 数据来源：微信读书 ｜ 共 <span id="footerCount">0</span> 本书
  </div>
</div>

<script>
let booksIndex = [];

async function loadIndex() {
  try {
    const resp = await fetch('books_index.json');
    booksIndex = await resp.json();
    renderBooks(booksIndex);
    updateStats();
  } catch(e) {
    console.error('Failed to load index:', e);
    document.getElementById('bookGrid').innerHTML = '<p style="text-align:center;color:#999;">加载失败，请刷新重试</p>';
  }
}

function updateStats() {
  const totalBooks = booksIndex.length;
  const totalHighlights = booksIndex.reduce((s,b) => s + b.highlights, 0);
  const totalReviews = booksIndex.reduce((s,b) => s + b.reviews, 0);
  const totalNotes = totalHighlights + totalReviews;
  document.getElementById('statBooks').textContent = totalBooks;
  document.getElementById('statNotes').textContent = totalNotes;
  document.getElementById('statHighlights').textContent = totalHighlights;
  document.getElementById('statReviews').textContent = totalReviews;
  document.getElementById('footerCount').textContent = totalBooks;
}

function renderBooks(books) {
  const grid = document.getElementById('bookGrid');
  if (books.length === 0) {
    grid.innerHTML = '<p style="text-align:center;color:#999;grid-column:1/-1;">没有找到匹配的书</p>';
    return;
  }
  grid.innerHTML = books.map((b, i) => {
    const progress = Math.min(b.progress, 100);
    const progressColor = progress >= 90 ? '#4A7C59' : progress >= 50 ? '#C77D3F' : '#999';
    return `
      <div class="book-card" onclick="openBook('${b.filename}')">
        <div class="badge">${b.totalNotes} 条</div>
        <h3>《${b.title}》</h3>
        <div class="author">${b.author || '未知作者'}</div>
        <div class="meta">
          <span>📝 ${b.highlights}</span>
          <span>💭 ${b.reviews}</span>
          <span>📊 ${progress}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${progress}%;background:${progressColor}"></div>
        </div>
      </div>
    `;
  }).join('');
}

function filterBooks() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) {
    renderBooks(booksIndex);
    return;
  }
  const filtered = booksIndex.filter(b =>
    b.title.toLowerCase().includes(q) || (b.author || '').toLowerCase().includes(q)
  );
  renderBooks(filtered);
}

async function openBook(filename) {
  const reader = document.getElementById('reader');
  const content = document.getElementById('readerContent');
  const hero = document.getElementById('heroSection');
  const searchBar = document.getElementById('searchBar');
  const grid = document.getElementById('bookGrid');

  hero.style.display = 'none';
  searchBar.style.display = 'none';
  grid.style.display = 'none';
  reader.classList.add('active');

  content.innerHTML = '<p style="text-align:center;color:#999;">加载中...</p>';
  reader.scrollIntoView({ behavior: 'smooth' });

  try {
    const resp = await fetch('notes_md/' + encodeURIComponent(filename));
    const md = await resp.text();
    content.innerHTML = marked.parse(md);
  } catch(e) {
    content.innerHTML = '<p style="text-align:center;color:#999;">加载失败</p>';
  }
}

function closeReader() {
  document.getElementById('reader').classList.remove('active');
  document.getElementById('heroSection').style.display = '';
  document.getElementById('searchBar').style.display = '';
  document.getElementById('bookGrid').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadIndex();
</script>
</body>
</html>
